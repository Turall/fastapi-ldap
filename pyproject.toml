[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-ldap"
version = "0.1.1"
description = "Production-ready LDAP authentication and authorization for FastAPI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "fastapi-ldap contributors"}
]
keywords = ["fastapi", "ldap", "authentication", "authorization", "active-directory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "ldap3>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "fastapi>=0.100.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-ldap3>=0.0.1",
    "uvicorn[standard]>=0.24.0",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=fastapi_ldap --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["fastapi_ldap"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.poetry]
name = "fastapi-ldap"
version = "0.1.0"
description = "Production-ready LDAP authentication and authorization for FastAPI"
readme = "README.md"
authors = ["fastapi-ldap contributors"]
license = "MIT"
keywords = ["fastapi", "ldap", "authentication", "authorization", "active-directory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = ">=2.0.0"
pydantic-settings = ">=2.0.0"
ldap3 = ">=2.9.0"

[tool.poetry.group.dev.dependencies]
fastapi = ">=0.100.0"
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=4.0.0"
black = ">=23.0.0"
ruff = ">=0.1.0"
mypy = ">=1.0.0"
types-ldap3 = ">=0.0.1"
uvicorn = {extras = ["standard"], version = ">=0.24.0"}

[tool.poetry.scripts]

